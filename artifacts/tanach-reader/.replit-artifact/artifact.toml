kind = "web"
previewPath = "/"
title = "קורא תנ\"ך ורש\"י"
version = "1.0.0"
id = "artifacts/tanach-reader"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25493

[services.development]
run = "pnpm --filter @workspace/tanach-reader run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tanach-reader", "run", "build" ]
serve = "static"
publicDir = "artifacts/tanach-reader/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25493"
BASE_PATH = "/"
